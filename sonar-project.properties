sonar.projectKey=GeraldineFrancois_Moustass-video
sonar.organization=geraldinefrancois

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Moustass-video
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.11

# Coverage reports (XML format generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclude patterns
sonar.exclusions=\
    **/__pycache__/**,\
    **/node_modules/**,\
    **/.virtualenv/**,\
    **/venv/**,\
    **/*.pyc,\
    **/migrations/**,\
    **/init_database.sql,\
    **/database_old.py,\
    **/static/**,\
    **/templates/**,\
    **/ui/**,\
    htmlcov/**,
    .pytest_cache/**

# Test exclusions (don't analyze test code as production code)
sonar.test.inclusions=tests/**/*.py

# Coverage exclusions (these won't affect coverage calculation)
sonar.coverage.exclusions=\
    tests/**,\
    **/__init__.py,\
    **/conftest.py,\
    **/test_*.py

# Duplication exclusions
sonar.cpd.exclusions=\
    tests/**,\
    **/migrations/**
