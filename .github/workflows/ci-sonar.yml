name: CI / Tests / SonarCloud

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test-and-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests and generate coverage + junit
        run: |
          mkdir -p reports
          python -m coverage run --source=src -m pytest --junitxml=reports/junit.xml -q
          python -m coverage xml -o coverage.xml

      - name: Normalize coverage.xml <source> to 'src'
        run: |
          python - <<'PY'
from pathlib import Path
import re
p=Path('coverage.xml')
s=p.read_text()
s2=re.sub(r'(<source>).*?(</source>)', r'\1src\2', s, count=1)
p.write_text(s2)
print('normalized coverage.xml')
PY

      - name: Upload test reports (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/junit.xml

      - name: Run SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
