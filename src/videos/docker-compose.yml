version: '3.9'

services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: moustass-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: videos_db
      MYSQL_USER: videos_user
      MYSQL_PASSWORD: videos_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Service Upload Vidéo
  upload-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moustass-upload-service
    environment:
      DB_USER: videos_user
      DB_PASSWORD: videos_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: videos_db
      SERVICE_PORT: 8002
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/uploads
      - ./src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
    command: python main_upload.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local

networks:
  default:
    name: moustass-network
