<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gestion Vidéos</title>
	<link rel="stylesheet" type="text/css" href="../css/index.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js" integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
	<button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample" id="btn-bars">
		<i class="fa-solid fa-bars"></i>
	</button>
	<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
		<div class="offcanvas-header">
			<h5 class="offcanvas-title" id="offcanvasExampleLabel">Moustass Video</h5>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
		</div>
		<div class="offcanvas-body">
			<div>
				<p class="text-muted mb-3">Menu de l'application Moustass video</p>
			</div>
			<ul>
				<li class="nav-item" id="list-nav"><a href="../index-admin.html" class="nav-link"><i class="fa-solid fa-house"></i> Accueil</a></li>
				<li class="nav-item"><a href="./log-admin.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i> Logs</a></li>
				<li class="nav-item"><a href="./video-admin.html" class="nav-link"><i class="fa-solid fa-video"></i> Vidéos</a></li>
			</ul>
			<button class="btn btn-danger mt-3" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</button>
		</div>
	</div>

	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h1 class="mb-0"><i class="fa-solid fa-video"></i> Gestion des Vidéos</h1>
				<p class="text-muted small mb-0">Consultation, vérification et téléchargement des vidéos</p>
			</div>
			<button class="btn btn-outline-primary" id="refreshVideosBtn"><i class="fa-solid fa-rotate"></i> Actualiser</button>
		</div>

		<div class="table-responsive">
			<table class="table table-hover table-striped align-middle">
				<thead>
					<tr>
						<th>ID Vidéo</th>
						<th>Expéditeur</th>
						<th>Destinataire</th>
						<th>Statut</th>
						<th>Signée</th>
						<th>Montant</th>
						<th>Date Expiration</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody id="videosBody">
					<tr id="videosEmpty"><td colspan="8" class="text-center text-muted py-4">Aucune vidéo disponible</td></tr>
				</tbody>
			</table>
		</div>
	</div>

	<div class="modal fade" id="verifyModal" tabindex="-1" aria-labelledby="verifyModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="verifyModalLabel"><i class="fa-solid fa-shield-halved"></i> Vérification de la signature</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="mb-3">
						<label for="videoIdInput" class="form-label">ID Vidéo</label>
						<input type="text" class="form-control" id="videoIdInput" readonly>
					</div>
					<div class="mb-3">
						<label for="publicKeyInput" class="form-label">Clé publique de l'expéditeur</label>
						<textarea class="form-control" id="publicKeyInput" rows="6" placeholder="Collez la clé publique PEM ici..."></textarea>
					</div>
					<button class="btn btn-primary" id="verifyBtn"><i class="fa-solid fa-check-circle"></i> Vérifier la signature</button>
					<div id="verifyResult" class="mt-3" style="display:none"></div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		const VIDEO_API = 'http://localhost:8002/api/videos';
		const cleanB64 = (v) => (v || '').replace(/\s+/g, '');
		const b64ToBytes = (b64) => Uint8Array.from(atob(cleanB64(b64)), (c) => c.charCodeAt(0));

		async function logout(){
			localStorage.removeItem('access_token');
			window.location.href = '/';
		}

		async function loadVideos(){
			const tbody = document.getElementById('videosBody');
			const empty = document.getElementById('videosEmpty');
			tbody.innerHTML = '';
			try{
				const res = await fetch(`${VIDEO_API}/list`);
				if(!res.ok) throw new Error(`HTTP ${res.status}`);
				const videos = await res.json();
				if(!videos.length){ empty.style.display='table-row'; tbody.appendChild(empty); return; }
				empty.style.display='none';
				videos.forEach(v=>{
					const tr = document.createElement('tr');
					const statusBadge = `<span class="badge bg-secondary">${v.status||''}</span>`;
					const signedBadge = v.is_signed ? '<span class="badge bg-success">Oui</span>' : '<span class="badge bg-warning">Non</span>';
					tr.innerHTML = `<td>${v.id}</td><td>${v.sender_id||''}</td><td>${v.receiver_id||''}</td><td>${statusBadge}</td><td>${signedBadge}</td><td>${Number.parseFloat(v.amount||0).toFixed(2)}</td><td class="small">${v.expires_at||''}</td><td></td>`;
					const actions = tr.querySelector('td:last-child');
					const verifyBtn = document.createElement('button');
					verifyBtn.className='btn btn-sm btn-outline-info me-1';
					verifyBtn.innerHTML='<i class="fa-solid fa-shield-halved"></i>';
					verifyBtn.title='Vérifier signature';
					verifyBtn.addEventListener('click', ()=>openVerifyModal(v.id));
					const dlBtn = document.createElement('button');
					dlBtn.className='btn btn-sm btn-success me-1';
					dlBtn.innerHTML='<i class="fa-solid fa-download"></i>';
					dlBtn.title='Télécharger';
					dlBtn.addEventListener('click', ()=>downloadVideo(v.id));
					actions.appendChild(verifyBtn);
					actions.appendChild(dlBtn);
					tbody.appendChild(tr);
				});
			}catch(e){ console.warn('loadVideos failed', e); empty.style.display='table-row'; tbody.appendChild(empty); }
		}

		function openVerifyModal(videoId){
			document.getElementById('videoIdInput').value = videoId;
			document.getElementById('publicKeyInput').value = '';
			document.getElementById('verifyResult').style.display = 'none';
			const modal = new bootstrap.Modal(document.getElementById('verifyModal'));
			modal.show();
		}

		async function verifySignature(){
			const videoId = document.getElementById('videoIdInput').value.trim();
			const publicKey = document.getElementById('publicKeyInput').value.trim();
			const resultDiv = document.getElementById('verifyResult');
			if(!videoId || !publicKey){ alert('Veuillez renseigner la clé publique'); return; }
			try{
				const res = await fetch(`${VIDEO_API}/${videoId}/verify`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ public_key: publicKey })
				});
				const data = await res.json();
				if(!res.ok){
					resultDiv.innerHTML = `<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> Erreur: ${data.detail || 'Échec de la vérification'}</div>`;
				}else{
					const isValid = data.is_valid || data.valid;
					if(isValid){
						resultDiv.innerHTML = '<div class="alert alert-success"><i class="fa-solid fa-circle-check"></i> Signature valide ! La vidéo est authentique.</div>';
					}else{
						resultDiv.innerHTML = '<div class="alert alert-warning"><i class="fa-solid fa-triangle-exclamation"></i> Signature invalide ! La vidéo pourrait être altérée.</div>';
					}
				}
				resultDiv.style.display = 'block';
			}catch(err){
				resultDiv.innerHTML = `<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> Erreur réseau: ${err.message}</div>`;
				resultDiv.style.display = 'block';
			}
		}

		async function downloadVideo(videoId){
			if(!videoId){ alert('ID vidéo requis'); return; }
			try{
				const resp = await fetch(`${VIDEO_API}/${videoId}/download`);
				if(!resp.ok) throw new Error(await resp.text());
				const blob = await resp.blob();
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = `${videoId}.mp4`;
				a.click();
				setTimeout(()=>URL.revokeObjectURL(url), 1500);
			}catch(err){
				alert('Erreur téléchargement: ' + (err?.message || err));
			}
		}

		function wireActions(){
			const logoutBtn = document.getElementById('logoutBtn');
			if(logoutBtn) logoutBtn.addEventListener('click', logout);
			const refreshVideosBtn = document.getElementById('refreshVideosBtn');
			if(refreshVideosBtn) refreshVideosBtn.addEventListener('click', loadVideos);
			const verifyBtn = document.getElementById('verifyBtn');
			if(verifyBtn) verifyBtn.addEventListener('click', verifySignature);
		}

		document.addEventListener('DOMContentLoaded', ()=>{
			wireActions();
			loadVideos();
		});
	</script>
</body>
</html>
