<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Logs Admin</title>
	<link rel="stylesheet" type="text/css" href="../css/index.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js" integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
	<button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample" id="btn-bars">
		<i class="fa-solid fa-bars"></i>
	</button>
	<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
		<div class="offcanvas-header">
			<h5 class="offcanvas-title" id="offcanvasExampleLabel">Moustass Video</h5>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
		</div>
		<div class="offcanvas-body">
			<div>
				<p class="text-muted mb-3">Menu de l'application Moustass video</p>
			</div>
			<ul>
				<li class="nav-item list-nav"><a href="../index-admin.html" class="nav-link"><i class="fa-solid fa-house"></i> Accueil</a></li>
				<li class="nav-item list-nav"><a href="./log-admin.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i> Logs</a></li>
				<li class="nav-item list-nav"><a href="./video-admin.html" class="nav-link"><i class="fa-solid fa-video"></i> Vidéos</a></li>
			</ul>
			<button class="btn btn-danger mt-3" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</button>
		</div>
	</div>

	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="mb-0">Journal d'activités</h1>
			<button class="btn btn-outline-primary btn-sm" id="refreshAllBtn"><i class="fa-solid fa-rotate"></i> Tout actualiser</button>
		</div>

		<div class="row mb-5">
			<div class="col-md-6">
				<div class="card">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="mb-0"><i class="fa-solid fa-user"></i> Mes Logs</h5>
						<button class="btn btn-sm btn-outline-primary" id="refreshMyLogsBtn"><i class="fa-solid fa-rotate"></i></button>
					</div>
					<div class="card-body">
						<p class="text-muted small">Historique de mes actions sur la plateforme</p>
						<div class="table-responsive">
							<table class="table table-striped table-hover table-sm">
								<thead><tr><th>ID</th><th>Action</th><th>Succès</th><th>Date</th></tr></thead>
								<tbody id="myLogsBody">
									<tr id="myLogsEmpty"><td colspan="4" class="text-center text-muted py-3">Aucun log</td></tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>

			<div class="col-md-6">
				<div class="card">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="mb-0"><i class="fa-solid fa-users-gear"></i> Tous les Logs Admin</h5>
						<button class="btn btn-sm btn-outline-primary" id="refreshAdminLogsBtn"><i class="fa-solid fa-rotate"></i></button>
					</div>
					<div class="card-body">
						<p class="text-muted small">Vue globale de toutes les activités du système</p>
						<div class="table-responsive">
							<table class="table table-striped table-hover table-sm">
								<thead><tr><th>ID</th><th>User</th><th>Rôle</th><th>Action</th><th>Succès</th><th>Date</th></tr></thead>
								<tbody id="adminLogsBody">
									<tr id="adminLogsEmpty"><td colspan="6" class="text-center text-muted py-3">Aucun log</td></tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		const AUTH_API = '/';

		async function logout(){
			localStorage.removeItem('access_token');
			window.location.href = '/';
		}

		async function loadMyLogs(){
			const tbody = document.getElementById('myLogsBody');
			const empty = document.getElementById('myLogsEmpty');
			tbody.innerHTML = '';
			const token = localStorage.getItem('access_token');
			if(!token){ empty.style.display='table-row'; tbody.appendChild(empty); return; }
			try{
				const res = await fetch('/logs', { headers: { 'Authorization': 'Bearer '+token } });
				if(!res.ok) throw new Error(`HTTP ${res.status}`);
				const j = await res.json();
				const logs = j.logs || [];
				if(!logs.length){ empty.style.display='table-row'; tbody.appendChild(empty); return; }
				empty.style.display='none';
				logs.forEach(r=>{
					const tr = document.createElement('tr');
					const successBadge = r.success ? '<span class="badge bg-success">Oui</span>' : '<span class="badge bg-danger">Non</span>';
					tr.innerHTML = `<td>${r.id}</td><td>${r.action_type||''}</td><td>${successBadge}</td><td class="small">${r.timestamp||''}</td>`;
					tbody.appendChild(tr);
				});
			}catch(e){ console.warn('loadMyLogs failed', e); empty.style.display='table-row'; tbody.appendChild(empty); }
		}

		async function loadAdminLogs(){
			const tbody = document.getElementById('adminLogsBody');
			const empty = document.getElementById('adminLogsEmpty');
			tbody.innerHTML = '';
			const token = localStorage.getItem('access_token');
			if(!token){ empty.style.display='table-row'; tbody.appendChild(empty); return; }
			try{
				const res = await fetch('/admin/logs', { headers: { 'Authorization': 'Bearer '+token } });
				if(!res.ok) throw new Error(`HTTP ${res.status}`);
				const j = await res.json();
				const logs = j.logs || [];
				if(!logs.length){ empty.style.display='table-row'; tbody.appendChild(empty); return; }
				empty.style.display='none';
				logs.forEach(r=>{
					const tr = document.createElement('tr');
					const successBadge = r.success ? '<span class="badge bg-success">Oui</span>' : '<span class="badge bg-danger">Non</span>';
					const roleBadge = (r.role||'').toUpperCase().includes('ADMIN') ? '<span class="badge bg-primary">Admin</span>' : '<span class="badge bg-secondary">User</span>';
					tr.innerHTML = `<td>${r.id}</td><td>${r.user_id||''}</td><td>${roleBadge}</td><td>${r.action_type||''}</td><td>${successBadge}</td><td class="small">${r.timestamp||''}</td>`;
					tbody.appendChild(tr);
				});
			}catch(e){ console.warn('loadAdminLogs failed', e); empty.style.display='table-row'; tbody.appendChild(empty); }
		}

		function wireActions(){
			const logoutBtn = document.getElementById('logoutBtn');
			if(logoutBtn) logoutBtn.addEventListener('click', logout);
			const refreshMyLogsBtn = document.getElementById('refreshMyLogsBtn');
			if(refreshMyLogsBtn) refreshMyLogsBtn.addEventListener('click', loadMyLogs);
			const refreshAdminLogsBtn = document.getElementById('refreshAdminLogsBtn');
			if(refreshAdminLogsBtn) refreshAdminLogsBtn.addEventListener('click', loadAdminLogs);
			const refreshAllBtn = document.getElementById('refreshAllBtn');
			if(refreshAllBtn) refreshAllBtn.addEventListener('click', ()=>{ loadMyLogs(); loadAdminLogs(); });
		}

		document.addEventListener('DOMContentLoaded', ()=>{
			wireActions();
			loadMyLogs();
			loadAdminLogs();
		});
	</script>
</body>
</html>
