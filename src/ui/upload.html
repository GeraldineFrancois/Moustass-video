<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Upload</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row g-4">

        <!-- Upload Form -->
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="mb-4">
                        <i class="fa-solid fa-upload me-2"></i>Upload Video
                    </h4>

                    <form action="/upload" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Video (.mp4 / .ts)</label>
                            <input type="file" name="file" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Sender ID</label>
                            <input type="text" name="sender_id" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Receiver</label>
                            <input type="text" name="receiver_id" class="form-control" value="ADMIN" required readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Encrypted AES Key (RSA-3072)</label>
                            <textarea name="encrypted_key" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" step="0.01" name="amount" class="form-control" required>
                        </div>

                        <button class="btn btn-primary w-100">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Video List -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="mb-4">
                        <i class="fa-solid fa-film me-2"></i>Uploaded Videos
                    </h4>

                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Status</th>
                            <th>Amount</th>
                            <th>Expires</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr>
                            <td class="small">a3f2...e91</td>
                            <td><span class="badge bg-success">UPLOADED</span></td>
                            <td>250.00</td>
                            <td>2026-03-01</td>
                            <td>
                                <button class="btn btn-sm btn-primary">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-danger">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
