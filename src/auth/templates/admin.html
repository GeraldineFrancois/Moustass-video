<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin Dashboard</title>
  </head>
  <body class="p-4">
    <div class="container">
      <h3>Admin Dashboard</h3>
      <div class="mb-3 d-flex gap-2">
        <button id="deleteAccountBtn" class="btn btn-danger">Supprimer mon compte</button>
        <button id="logoutBtn" class="btn btn-secondary">Se déconnecter</button>
      </div>

      <!-- Tabpanel -->
      <ul class="nav nav-tabs" id="adminTab">
        <li class="nav-item">
          <button class="nav-link active" id="tab-public-key" data-bs-toggle="tab" data-bs-target="#public-key" type="button">Ma clé publique</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-create-admin" data-bs-toggle="tab" data-bs-target="#create-admin" type="button">Créer un admin</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-logs" data-bs-toggle="tab" data-bs-target="#logs" type="button">Historique de connexions</button>
        </li>
      </ul>
      <div class="tab-content p-3 border border-top-0 mb-3">
        <div class="tab-pane fade show active" id="public-key">
          <div class="input-group mb-2">
            <textarea id="myPublicKey" class="form-control" rows="6" readonly placeholder="Votre clé publique s'affichera ici après connexion"></textarea>
            <button id="copyPublicBtn" class="btn btn-outline-secondary">Copier</button>
          </div>
        </div>

        <div class="tab-pane fade" id="create-admin">
          <div class="card p-3">
            <h5>Créer un admin</h5>
            <form id="adminCreateForm">
              <div class="row g-2">
                <div class="col"><input class="form-control" name="firstname" placeholder="Prénom" required></div>
                <div class="col"><input class="form-control" name="lastname" placeholder="Nom" required></div>
              </div>
              <div class="mt-2"><input class="form-control" name="email" placeholder="Email" required></div>
              <div class="mt-2"><input class="form-control" type="password" name="password" placeholder="Mot de passe" required autocomplete="new-password"></div>
              <div class="mt-2"><input class="form-control" type="password" name="confirm_password" placeholder="Confirmer mot de passe" required autocomplete="new-password"></div>
              <div class="mt-2"><button class="btn btn-primary">Créer admin</button></div>
            </form>
            <div id="adminKeys" class="mt-2" style="display:none">
              <label for="adminPrivate" class="form-label">Clé privée</label>
              <textarea id="adminPrivate" class="form-control" rows="6" readonly></textarea>
              <label for="adminPublic" class="form-label mt-2">Clé publique</label>
              <textarea id="adminPublic" class="form-control" rows="6" readonly></textarea>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="logs">
          <div class="row">
            <div class="col-md-6">
              <div class="card p-3 mb-3">
                <h5>Mes connexions récentes</h5>
                <div class="table-responsive">
                  <table id="myLogs" class="table table-sm">
                    <thead><tr><th>ID</th><th>Action</th><th>Succès</th><th>Timestamp</th></tr></thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card p-3 mb-3">
                <h5>Tous les logs (admin)</h5>
                <div class="table-responsive">
                  <table id="allLogs" class="table table-sm">
                    <thead><tr><th>ID</th><th>User ID</th><th>Role</th><th>Action</th><th>Succès</th><th>Timestamp</th></tr></thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOHN4QLNJIKKwhZ7S38YnN9Zx" crossorigin="anonymous"></script>
      <script>
        // ==================== Configuration & Constants ====================
        const BEARER = 'Bearer ';
        const API_TIMEOUT = 5000;

        // ==================== Token Management ====================
        /**
         * Get the JWT token from localStorage.
         * @returns {string|null} The access token or null if not found
         */
        function getToken() {
          return localStorage.getItem('access_token');
        }

        /**
         * Build Authorization header value with Bearer token.
         * @returns {Object} Headers object ready for fetch()
         */
        function getAuthHeaders() {
          const token = getToken();
          return token ? { 'Authorization': BEARER + token } : {};
        }

        // ==================== Public Key Management ====================
        /**
         * Fetch and display current user's public key.
         * Called on page load and after admin creation.
         */
        async function fetchMyPublicKey() {
          const token = getToken();
          if (!token) return;
          try {
            const res = await fetch('/me', { headers: getAuthHeaders() });
            if (!res.ok) return;
            const data = await res.json();
            document.getElementById('myPublicKey').value = data.public_key || '';
          } catch (e) {
            console.warn('fetchMyPublicKey failed', e);
          }
        }

        /**
         * Copy public key to clipboard using modern API with fallback.
         */
        function setupPublicKeyCopy() {
          document.getElementById('copyPublicBtn').addEventListener('click', async () => {
            const textarea = document.getElementById('myPublicKey');
            try {
              await navigator.clipboard.writeText(textarea.value);
            } catch (e) {
              console.warn('clipboard write failed, falling back to select()', e);
              try { textarea.select(); } catch (err) { console.warn('textarea select failed', err); }
            }
          });
        }

        // ==================== Admin Creation ====================
        /**
         * Handle admin account creation form submission.
         * Validates passwords, calls /signup_admin, displays private key.
         */
        function setupAdminForm() {
          const form = document.getElementById('adminCreateForm');
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());

            try {
              const res = await fetch('/signup_admin', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  ...getAuthHeaders()
                },
                body: JSON.stringify(data)
              });

              const json = await res.json();
              if (!res.ok) {
                alert('Erreur: ' + (json.detail || JSON.stringify(json)));
                return;
              }

              // Display generated keys
              document.getElementById('adminPrivate').value = json.private_key || '';
              document.getElementById('adminPublic').value = (json.user && json.user.public_key) ? json.user.public_key : '';
              document.getElementById('adminKeys').style.display = 'block';

              // Refresh both tables
              fetchMyPublicKey();
              fetchMyLogs();
              fetchAllLogs();
            } catch (e) {
              console.error('Admin creation failed', e);
              alert('Erreur: ' + e.message);
            }
          });
        }

        // ==================== Log Display ====================
        /**
         * Fetch and display current user's connection logs.
         */
        async function fetchMyLogs() {
          const token = getToken();
          if (!token) return;
          try {
            const res = await fetch('/logs', { headers: getAuthHeaders() });
            if (!res.ok) return;
            const data = await res.json();

            const tbody = document.querySelector('#myLogs tbody');
            tbody.innerHTML = '';
            (data.logs || []).forEach(log => {
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${log.id}</td>
                <td>${log.action_type}</td>
                <td>${log.success ? 'Oui' : 'Non'}</td>
                <td>${log.timestamp || ''}</td>
              `;
              tbody.appendChild(row);
            });
          } catch (e) {
            console.warn('fetchMyLogs failed', e);
          }
        }

        /**
         * Fetch and display all users' logs (admin only).
         */
        async function fetchAllLogs() {
          const token = getToken();
          if (!token) return;
          try {
            const res = await fetch('/admin/logs', { headers: getAuthHeaders() });
            if (!res.ok) return;
            const data = await res.json();

            const tbody = document.querySelector('#allLogs tbody');
            tbody.innerHTML = '';
            (data.logs || []).forEach(log => {
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${log.id}</td>
                <td>${log.user_id}</td>
                <td>${log.role || ''}</td>
                <td>${log.action_type}</td>
                <td>${log.success ? 'Oui' : 'Non'}</td>
                <td>${log.timestamp || ''}</td>
              `;
              tbody.appendChild(row);
            });
          } catch (e) {
            console.warn('fetchAllLogs failed', e);
          }
        }

        // ==================== Account Management ====================
        /**
         * Clear token and redirect to login page.
         */
        function logoutAndRedirect() {
          localStorage.removeItem('access_token');
          globalThis.location.href = '/';
        }

        /**
         * Delete current user account after confirmation.
         * Fetches user info via /me, confirms deletion, calls /delete_account.
         */
        async function deleteAccountAndRedirect() {
          const token = getToken();
          if (!token) return alert('Non authentifié');

          try {
            // Get user email for display
            const res = await fetch('/me', { headers: getAuthHeaders() });
            if (!res.ok) return alert('Impossible de récupérer l\'utilisateur');
            const me = await res.json();

            // Confirm deletion with user
            if (!confirm(`Supprimer votre compte ${me.email} ? Cette action est irréversible.`)) {
              return;
            }

            // Call delete endpoint
            const form = new FormData();
            form.append('email', me.email);
            const del = await fetch('/delete_account', { method: 'POST', body: form });
            if (!del.ok) return alert('Erreur lors de la suppression');

            // Success: logout and redirect
            logoutAndRedirect();
          } catch (e) {
            console.error('Account deletion failed', e);
            alert('Erreur: ' + e.message);
          }
        }

        // ==================== Page Initialization ====================
        document.addEventListener('DOMContentLoaded', () => {
          // Load initial public key
          fetchMyPublicKey();

          // Setup UI event handlers
          setupPublicKeyCopy();
          setupAdminForm();

          // Setup logout/delete buttons
          const logoutBtn = document.getElementById('logoutBtn');
          if (logoutBtn) logoutBtn.addEventListener('click', () => logoutAndRedirect());

          const deleteBtn = document.getElementById('deleteAccountBtn');
          if (deleteBtn) deleteBtn.addEventListener('click', () => deleteAccountAndRedirect());

          // Load logs when tabs open
          const logsTab = document.getElementById('tab-logs');
          if (logsTab) {
            logsTab.addEventListener('shown.bs.tab', () => {
              fetchMyLogs();
              fetchAllLogs();
            });
          }
            // Ensure tabs work even if Bootstrap events fail: fallback manual toggling
            initializeTabsFallback();
        });

          /**
           * Fallback tab activation: toggles `.active` and `.show` classes
           * so tabs work even when Bootstrap JS events aren't firing.
           */
          function initializeTabsFallback() {
            const tabButtons = document.querySelectorAll('#adminTab [data-bs-toggle="tab"]');
            if (!tabButtons || tabButtons.length === 0) return;
            tabButtons.forEach(btn => {
              btn.addEventListener('click', (e) => {
                // If Bootstrap Tab API is present, let it handle activation
                if (globalThis.bootstrap !== undefined && globalThis.bootstrap.Tab) {
                  return;
                }

                e.preventDefault();
                const targetSelector = (btn.dataset && btn.dataset.bsTarget) ? btn.dataset.bsTarget : btn.getAttribute('data-bs-target');
                const target = document.querySelector(targetSelector);
                if (!target) return;
                // deactivate other buttons
                tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // deactivate panes
                const panes = document.querySelectorAll('.tab-pane');
                panes.forEach(p => p.classList.remove('show', 'active'));
                target.classList.add('show', 'active');
              });
            });
          }
      </script>

      <div>
        <p>Interface minimale pour ce sprint.</p>
      </div>
    </div>
  </body>
</html>
