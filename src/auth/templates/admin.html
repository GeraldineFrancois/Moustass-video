<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin Dashboard</title>
  </head>
  <body class="p-4">
    <div class="container">
      <h3>Admin Dashboard</h3>
      <div class="mb-3 d-flex gap-2">
        <button class="btn btn-secondary" onclick="alert('Déconnexion')">Se déconnecter</button>
      </div>

      <div class="mb-3">
        <h5>Mon tableau de bord</h5>
        <div class="input-group mb-2">
          <textarea id="myPublicKey" class="form-control" rows="6" readonly placeholder="Votre clé publique s'affichera ici après connexion"></textarea>
          <button id="copyPublicBtn" class="btn btn-outline-secondary">Copier</button>
        </div>
      </div>

      <div class="card p-3 mb-3">
        <h5>Créer un admin</h5>
        <form id="adminCreateForm">
          <div class="row g-2">
            <div class="col"><input class="form-control" name="firstname" placeholder="Prénom" required></div>
            <div class="col"><input class="form-control" name="lastname" placeholder="Nom" required></div>
          </div>
          <div class="mt-2"><input class="form-control" name="email" placeholder="Email" required></div>
          <div class="mt-2"><input class="form-control" type="password" name="password" placeholder="Mot de passe" required autocomplete="new-password"></div>
          <div class="mt-2"><input class="form-control" type="password" name="confirm_password" placeholder="Confirmer mot de passe" required autocomplete="new-password"></div>
          <div class="mt-2"><button class="btn btn-primary">Créer admin</button></div>
        </form>
        <div id="adminKeys" class="mt-2" style="display:none">
          <label for="adminPrivate" class="form-label">Clé privée</label>
          <textarea id="adminPrivate" class="form-control" rows="6" readonly></textarea>
          <label for="adminPublic" class="form-label mt-2">Clé publique</label>
          <textarea id="adminPublic" class="form-control" rows="6" readonly></textarea>
        </div>
      </div>

      <script>
        async function fetchMyPublicKey(){
          const token = localStorage.getItem('access_token');
          if(!token) return;
          try{
            const res = await fetch('/me', { headers: { 'Authorization': 'Bearer '+token } });
            if(!res.ok) return;
            const j = await res.json();
            document.getElementById('myPublicKey').value = j.public_key || '';
          }catch(e){
            console.warn('fetchMyPublicKey failed', e);
          }
        }

        document.addEventListener('DOMContentLoaded', ()=>{
          fetchMyPublicKey();

          document.getElementById('copyPublicBtn').addEventListener('click', async ()=>{
            const ta = document.getElementById('myPublicKey');
            try{
              await navigator.clipboard.writeText(ta.value);
            }catch(e){
              console.warn('clipboard write failed, falling back to select()', e);
              try{ ta.select(); }catch(error_){ console.warn('textarea select failed', error_); }
            }
          });

          const form = document.getElementById('adminCreateForm');
          form.addEventListener('submit', async (e)=>{
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());
            const token = localStorage.getItem('access_token');
            const res = await fetch('/signup_admin', { method:'POST', headers:{'Content-Type':'application/json', 'Authorization': token ? 'Bearer '+token : ''}, body: JSON.stringify(data) });
            const txt = await res.text();
            let json = {};
            try{ json = JSON.parse(txt); }catch(error_){ console.warn('Failed to parse /signup_admin response', error_, txt); alert('Erreur: '+txt); return; }
            if(!res.ok){ alert('Erreur: '+(json.detail||JSON.stringify(json))); return; }
            document.getElementById('adminPrivate').value = json.private_key || '';
            document.getElementById('adminPublic').value = (json.user && json.user.public_key) ? json.user.public_key : '';
            document.getElementById('adminKeys').style.display = 'block';
            // Refresh my public key in case it changed
            fetchMyPublicKey();
          });
        });
      </script>

      <div>
        <p>Interface minimale pour ce sprint.</p>
      </div>
    </div>
  </body>
</html>
