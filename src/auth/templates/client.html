<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5.3.8 CSS avec vérification d'intégrité -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous">
    <title>Client Dashboard</title>
  </head>
  <body class="p-4">
    <div class="container">
      <h3>Client Dashboard</h3>
      <div class="mb-3 d-flex gap-2">
        <button id="deleteAccountBtn" class="btn btn-danger">Supprimer mon compte</button>
        <button id="logoutBtn" class="btn btn-secondary">Se déconnecter</button>
      </div>

      <!-- Client tabpanel -->
      <ul class="nav nav-tabs" id="clientTab">
        <li class="nav-item">
          <button class="nav-link active" id="c-tab-public-key" data-bs-toggle="tab" data-bs-target="#c-public-key" type="button">Ma clé publique</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="c-tab-logs" data-bs-toggle="tab" data-bs-target="#c-logs" type="button">Historique de connexions</button>
        </li>
      </ul>
      <div class="tab-content p-3 border border-top-0 mb-3">
        <div class="tab-pane fade show active" id="c-public-key">
          <div class="card p-3">
            <h5>Vos clés</h5>
            <div>
              <label for="clientPublic" class="form-label">Clé publique</label>
              <div class="d-flex gap-2 mb-2">
                <button id="copyClientPublicBtn" class="btn btn-outline-secondary btn-sm">Copier la clé publique</button>
              </div>
              <textarea id="clientPublic" class="form-control" rows="6" readonly></textarea>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="c-logs">
          <div class="card p-3 mt-3">
            <h5>Historique des connexions</h5>
            <div class="table-responsive">
              <table id="logsTable" class="table table-sm">
                <thead>
                  <tr><th>ID</th><th>Action</th><th>Succès</th><th>Timestamp</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
         </div>
      </div>
      <script>
        /* ═══════════════════════════════════════════════════════════════════════════
         * SÉCURITÉ XSS - Fonctions de protection contre l'injection de code
         * ═══════════════════════════════════════════════════════════════════════════ */

        /**
         * Crée une cellule de tableau sécurisée avec du texte échappé.
         * Utilise textContent au lieu de innerHTML pour éviter les XSS.
         */
        function createSafeCell(text, className = '') {
          const td = document.createElement('td');
          td.textContent = text ?? '';
          if (className) td.className = className;
          return td;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * GESTION DE LA CLÉ PUBLIQUE
         * ═══════════════════════════════════════════════════════════════════════════ */

        async function fetchMyPublicKey(){
          const token = localStorage.getItem('access_token');
          if(!token) return;
          try{
            const res = await fetch('/me', { headers: { 'Authorization': 'Bearer '+token } });
            if(!res.ok) return;
            const j = await res.json();
            document.getElementById('clientPublic').value = j.public_key || '';
          }catch(e){
            console.warn('fetchMyPublicKey failed', e);
            // keep UI silent but log the error for diagnostics
          }
        }

        document.addEventListener('DOMContentLoaded', ()=>{
          fetchMyPublicKey();
          fetchLogs();
          document.getElementById('copyClientPublicBtn').addEventListener('click', async ()=>{
            const ta = document.getElementById('clientPublic');
            try{
              await navigator.clipboard.writeText(ta.value);
            }catch(e){
              console.warn('clipboard write failed, falling back to select()', e);
              try{ ta.select(); }catch(error_){ console.warn('textarea select failed', error_); }
            }
          });
          // wire logout/delete
          const logoutBtn = document.getElementById('logoutBtn');
          if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ localStorage.removeItem('access_token'); globalThis.location.href = '/'; });
          const delBtn = document.getElementById('deleteAccountBtn');
          if(delBtn) delBtn.addEventListener('click', async ()=>{
            if(!confirm('Supprimer votre compte ? Cette action est irréversible.')) return;
            const token = localStorage.getItem('access_token');
            if(!token) return alert('Non authentifié');
            const res = await fetch('/me', { headers: { 'Authorization': 'Bearer '+token } });
            if(!res.ok) return alert('Impossible de récupérer l\'utilisateur');
            const me = await res.json();
            const form = new FormData(); form.append('email', me.email);
            const del = await fetch('/delete_account', { method:'POST', body: form });
            if(!del.ok) return alert('Erreur lors de la suppression');
            localStorage.removeItem('access_token'); globalThis.location.href = '/';
          });
        });

        async function fetchLogs(){
          const token = localStorage.getItem('access_token');
          if(!token) return;
          try{
            const res = await fetch('/logs', { headers: { 'Authorization': 'Bearer '+token } });
            if(!res.ok) return;
            const j = await res.json();
            const tbody = document.querySelector('#logsTable tbody');
            tbody.innerHTML = '';
            (j.logs||[]).forEach(r=>{
              // Création sécurisée de la ligne (protection XSS)
              const tr = document.createElement('tr');
              tr.appendChild(createSafeCell(r.id));
              tr.appendChild(createSafeCell(r.action_type));
              tr.appendChild(createSafeCell(r.success ? 'Oui' : 'Non'));
              tr.appendChild(createSafeCell(r.timestamp || ''));
              tbody.appendChild(tr);
            });
          }catch(e){ console.warn('fetchLogs failed', e); }
        }
      </script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
