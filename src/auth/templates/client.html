<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Client Dashboard</title>
  </head>
  <body class="p-4">
    <div class="container">
      <h3>Client Dashboard</h3>
      <div class="mb-3 d-flex gap-2">
        <button id="deleteAccountBtn" class="btn btn-danger">Supprimer mon compte</button>
        <button id="logoutBtn" class="btn btn-secondary">Se déconnecter</button>
      </div>

      <!-- Client tabpanel -->
      <ul class="nav nav-tabs" id="clientTab">
        <li class="nav-item">
          <button class="nav-link active" id="c-tab-public-key" data-bs-toggle="tab" data-bs-target="#c-public-key" type="button">Ma clé publique</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="c-tab-logs" data-bs-toggle="tab" data-bs-target="#c-logs" type="button">Historique de connexions</button>
        </li>
      </ul>
      <div class="tab-content p-3 border border-top-0 mb-3">
        <div class="tab-pane fade show active" id="c-public-key">
          <div class="card p-3">
            <h5>Vos clés</h5>
            <div>
              <label for="clientPublic" class="form-label">Clé publique</label>
              <div class="d-flex gap-2 mb-2">
                <button id="copyClientPublicBtn" class="btn btn-outline-secondary btn-sm">Copier la clé publique</button>
              </div>
              <textarea id="clientPublic" class="form-control" rows="6" readonly></textarea>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="c-logs">
          <div class="card p-3 mt-3">
            <h5>Historique des connexions</h5>
            <div class="table-responsive">
              <table id="logsTable" class="table table-sm">
                <thead>
                  <tr><th>ID</th><th>Action</th><th>Succès</th><th>Timestamp</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
         </div>
      </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOHN4QLNJIKKwhZ7S38YnN9Zx" crossorigin="anonymous"></script>
      <script>
        // ==================== Configuration & Constants ====================
        const BEARER = 'Bearer ';

        // ==================== Token Management ====================
        /**
         * Get the JWT token from localStorage.
         * @returns {string|null} The access token or null if not found
         */
        function getToken() {
          return localStorage.getItem('access_token');
        }

        /**
         * Build Authorization header value with Bearer token.
         * @returns {Object} Headers object ready for fetch()
         */
        function getAuthHeaders() {
          const token = getToken();
          return token ? { 'Authorization': BEARER + token } : {};
        }

        // ==================== Public Key Management ====================
        /**
         * Fetch and display current user's public key.
         * Called on page load.
         */
        async function fetchMyPublicKey() {
          const token = getToken();
          if (!token) return;
          try {
            const res = await fetch('/me', { headers: getAuthHeaders() });
            if (!res.ok) return;
            const data = await res.json();
            document.getElementById('clientPublic').value = data.public_key || '';
          } catch (e) {
            console.warn('fetchMyPublicKey failed', e);
          }
        }

        /**
         * Copy public key to clipboard using modern API with fallback.
         */
        function setupPublicKeyCopy() {
          document.getElementById('copyClientPublicBtn').addEventListener('click', async () => {
            const textarea = document.getElementById('clientPublic');
            try {
              await navigator.clipboard.writeText(textarea.value);
            } catch (e) {
              console.warn('clipboard write failed, falling back to select()', e);
              try { textarea.select(); } catch (err) { console.warn('textarea select failed', err); }
            }
          });
        }

        // ==================== Log Display ====================
        /**
         * Fetch and display current user's connection logs.
         */
        async function fetchLogs() {
          const token = getToken();
          if (!token) return;
          try {
            const res = await fetch('/logs', { headers: getAuthHeaders() });
            if (!res.ok) return;
            const data = await res.json();

            const tbody = document.querySelector('#logsTable tbody');
            tbody.innerHTML = '';
            (data.logs || []).forEach(log => {
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${log.id}</td>
                <td>${log.action_type}</td>
                <td>${log.success ? 'Oui' : 'Non'}</td>
                <td>${log.timestamp || ''}</td>
              `;
              tbody.appendChild(row);
            });
          } catch (e) {
            console.warn('fetchLogs failed', e);
          }
        }

        // ==================== Account Management ====================
        /**
         * Clear token and redirect to login page.
         */
        function logoutAndRedirect() {
          localStorage.removeItem('access_token');
          globalThis.location.href = '/';
        }

        /**
         * Delete current user account after confirmation.
         * Fetches user info via /me, confirms deletion, calls /delete_account.
         */
        async function deleteAccountAndRedirect() {
          if (!confirm('Supprimer votre compte ? Cette action est irréversible.')) {
            return;
          }

          const token = getToken();
          if (!token) return alert('Non authentifié');

          try {
            // Get user email for logging
            const res = await fetch('/me', { headers: getAuthHeaders() });
            if (!res.ok) return alert('Impossible de récupérer l\'utilisateur');
            const me = await res.json();

            // Call delete endpoint
            const form = new FormData();
            form.append('email', me.email);
            const del = await fetch('/delete_account', { method: 'POST', body: form });
            if (!del.ok) return alert('Erreur lors de la suppression');

            // Success: logout and redirect
            logoutAndRedirect();
          } catch (e) {
            console.error('Account deletion failed', e);
            alert('Erreur: ' + e.message);
          }
        }

        // ==================== Page Initialization ====================
        document.addEventListener('DOMContentLoaded', () => {
          // Load initial public key and logs
          fetchMyPublicKey();
          fetchLogs();

          // Setup UI event handlers
          setupPublicKeyCopy();

          // Setup logout/delete buttons
          const logoutBtn = document.getElementById('logoutBtn');
          if (logoutBtn) logoutBtn.addEventListener('click', () => logoutAndRedirect());

          const deleteBtn = document.getElementById('deleteAccountBtn');
          if (deleteBtn) deleteBtn.addEventListener('click', () => deleteAccountAndRedirect());
          // Ensure tabs work even if Bootstrap events fail: fallback manual toggling
          initializeTabsFallback();
        });

        function initializeTabsFallback() {
          const tabButtons = document.querySelectorAll('#clientTab [data-bs-toggle="tab"]');
          if (!tabButtons || tabButtons.length === 0) return;
          tabButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
              if (globalThis.bootstrap !== undefined && globalThis.bootstrap.Tab) return;
              e.preventDefault();
              const targetSelector = (btn.dataset && btn.dataset.bsTarget) ? btn.dataset.bsTarget : btn.getAttribute('data-bs-target');
              const target = document.querySelector(targetSelector);
              if (!target) return;
              tabButtons.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              const panes = document.querySelectorAll('.tab-pane');
              panes.forEach(p => p.classList.remove('show', 'active'));
              target.classList.add('show', 'active');
            });
          });
        }

    </body>
</html>
